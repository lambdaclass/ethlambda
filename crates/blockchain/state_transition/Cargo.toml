[package]
name = "ethlambda-state-transition"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ethlambda-types.workspace = true
thiserror.workspace = true

# Host-only: prometheus (metrics) and tracing have no meaning in the zkVM guest
# and prometheus doesn't build for the target. Included on every target except
# the zkVM guest (`target_os = "zkvm"`), which drops them automatically.
[target.'cfg(not(target_os = "zkvm"))'.dependencies]
ethlambda-metrics.workspace = true
tracing.workspace = true

[dev-dependencies]
ethlambda-test-fixtures.workspace = true
serde.workspace = true
serde_json.workspace = true

hex.workspace = true
libssz-types.workspace = true

datatest-stable = "0.3.3"

[[test]]
name = "stf_spectests"
path = "tests/stf_spectests.rs"
harness = false
