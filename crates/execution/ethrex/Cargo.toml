[package]
name = "ethlambda-ethrex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The `ethrex` binary's library half, for its node initializers and option set.
# Without its default `jemalloc` (ethlambda installs its own allocator) and
# `dev` (no local block producer here).
ethrex = { workspace = true, features = ["rocksdb", "c-kzg", "secp256k1", "metrics", "rayon"] }
ethrex-blockchain.workspace = true
ethrex-config.workspace = true
ethrex-crypto = { workspace = true, features = ["c-kzg"] }
ethrex-p2p.workspace = true
ethrex-rpc.workspace = true
ethrex-storage.workspace = true

axum = "0.8.1"
bytes = "1"
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
ethlambda-engine = { workspace = true, features = ["include-ethrex"] }
ethlambda-types.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
