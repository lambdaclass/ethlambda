[package]
name = "ethlambda-storage"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ethlambda-crypto.workspace = true
ethlambda-types.workspace = true

tracing.workspace = true
rocksdb.workspace = true
thiserror.workspace = true

# `ethereum_types` because a beacon `Root` is an `ethereum_types::H256`, which
# `States` and the beacon block tables both key and encode.
libssz = { workspace = true, features = ["ethereum_types"] }
libssz-derive.workspace = true
libssz-types.workspace = true

lru.workspace = true

[dev-dependencies]
tempfile = "3"
leansig.workspace = true
rand.workspace = true
