[package]
name = "ethlambda-storage"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ethlambda-crypto.workspace = true
ethlambda-metrics.workspace = true
ethlambda-types.workspace = true

tracing.workspace = true
rocksdb = { workspace = true, optional = true }
thiserror.workspace = true

libssz.workspace = true
libssz-derive.workspace = true
libssz-types.workspace = true

lru.workspace = true
xdelta3.workspace = true

# The cached fork-choice weights look a block root up once per vote batch, and
# once per latest message on a rebuild; std's SipHash was one of the largest
# costs of the head computation's tally. Already in the lockfile through other
# crates, so this adds no new version.
foldhash = "0.2.0"

[features]
# The persistent backend, `backend::RocksDBBackend`. Off by default: every crate
# above this one but the binary stores through `InMemoryBackend` only, and
# RocksDB is a C++ build that would otherwise run in every one of their test and
# spec-test builds. `bin/ethlambda` turns it on. A `cargo test --workspace` run
# includes the binary, so feature unification turns it on there too, and the
# backend's own tests run with the rest of the node half.
rocksdb = ["dep:rocksdb"]

[dev-dependencies]
tempfile = "3"
proptest = "1"
blst = "0.3.16"
