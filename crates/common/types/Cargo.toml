[package]
name = "ethlambda-types"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Make minimal the preset a process runs when nothing selects one
# (`Preset::DEFAULT`), instead of mainnet.
#
# The preset is a runtime choice: `ethlambda beacon` selects its network's
# `PRESET_BASE` at startup, and the validator client its beacon node's. This
# only matters to a process that never selects, which is a unit-test binary:
# it is how the `--lib` tests run under minimal. The binary never enables it.
# `ethlambda-state-transition`'s feature of the same name forwards to this one.
preset-minimal = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
hex.workspace = true

libssz.workspace = true
libssz-derive.workspace = true
libssz-merkle.workspace = true
libssz-types.workspace = true
sha2.workspace = true
smallvec.workspace = true

ethlambda-ssz-tree.workspace = true

[dev-dependencies]
serde_json.workspace = true
serde_yaml_ng.workspace = true
rand.workspace = true
ethlambda-test-fixtures.workspace = true

datatest-stable = "0.3.3"

[[test]]
name = "ssz_spectests"
path = "tests/ssz_spectests.rs"
harness = false
# Skipped by `cargo test`: the released leanSpec fixtures still carry the old
# leanVM key format and fail to decode. Run on demand with
# `cargo test --profile release-fast --test <name>`.
test = false
