[package]
name = "ethlambda-beacon"
description = "Ethereum Beacon Chain state transition and fork choice, phase0 through fulu"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Compile against the minimal preset instead of mainnet.
#
# Container shapes are compile-time constants (SSZ list and vector bounds), so
# the preset cannot be selected at runtime. Mainnet is the implicit default;
# enabling this feature switches every constant to the minimal preset. The test
# target builds the crate twice, once per preset, and each build walks only its
# own fixture tree.
preset-minimal = ["ethlambda-types/preset-minimal"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true

ethlambda-types.workspace = true

# The fork choice store. This ends the crate's isolation from the rest of the
# workspace, deliberately: a mainnet BeaconState is ~350 MB and cannot live in
# a HashMap. `ethlambda-storage` depends on `ethlambda-types` and nothing else
# of ours, so there is no cycle; the cost is that this crate's build now
# includes RocksDB.
ethlambda-storage.workspace = true

libssz = { workspace = true, features = ["ethereum_types"] }
libssz-derive.workspace = true
libssz-merkle = { workspace = true, features = ["ethereum_types"] }
libssz-types.workspace = true

# Matches the version ethrex uses, and the version libssz's `ethereum_types`
# feature is built against.
ethereum-types = "0.15.1"

# `asm` selects the CPU's SHA-256 instructions where it has them: the ARMv8
# crypto extensions on aarch64, and an assembly fallback on x86 for cores
# without SHA-NI. Without it `sha2` compiles the portable scalar backend on
# aarch64 no matter what the CPU supports, which merkleization feels directly,
# since `hash_tree_root` of a state is almost entirely SHA-256 compressions.
# Selection is at run time, through `cpufeatures`, so a build stays portable to
# hardware lacking the extensions.
#
# `libssz-merkle` depends on `sha2` too and asks for no features of its own;
# enabling one here reaches its copy as well, since Cargo unifies features
# across a version.
sha2 = { version = "0.10.9", features = ["asm"] }

# BLS12-381. Assembly-optimized, and the canonical consensus-layer backend.
blst = "0.3.16"

# KZG, including the EIP-7594 cell and column proofs that fulu needs. Same
# version and feature set ethrex uses, plus the embedded mainnet trusted setup.
c-kzg = { version = "2.1.8", features = ["ethereum_kzg_settings"] }

# Reduction modulo the BLS field order, for the two Fiat-Shamir challenge
# functions that c-kzg does not export.
num-bigint = "0.4.6"

[dev-dependencies]
serde.workspace = true
serde_yaml_ng.workspace = true
snap = "1.1.1"

# Supplies the spec-test binary's harness. A fixture case is only known once the
# fixture tree is walked, which `#[test]` cannot express, so the tests are built
# at run time instead. See `tests/spec_tests.rs` for the full reasoning.
libtest-mimic = "0.8.2"

[[test]]
name = "spec_tests"
harness = false
