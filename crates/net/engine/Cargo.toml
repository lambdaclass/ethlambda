[package]
name = "ethlambda-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ethlambda-types.workspace = true
# `json` on top of the workspace's rustls-only default: this crate's whole
# payload is JSON-RPC, and the feature only pulls in `serde_json`, which is
# already a direct dependency here.
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
hex.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

# The in-process transport (`include-ethrex`): ethrex's own Engine API handler
# types, called against an embedded node's RPC context.
bytes = { version = "1", optional = true }
ethrex-common = { workspace = true, optional = true }
ethrex-rlp = { workspace = true, optional = true }
ethrex-rpc = { workspace = true, optional = true }

[features]
# Adds `EngineClient::in_process`, which drives an ethrex embedded in this
# process through typed handler calls instead of JSON-RPC over HTTP.
include-ethrex = ["dep:bytes", "dep:ethrex-common", "dep:ethrex-rlp", "dep:ethrex-rpc"]

[dev-dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
] }
