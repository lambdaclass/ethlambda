[package]
name = "ethlambda-rpc"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
axum = "0.8.1"
# Peer-id validation for /eth/v1/node/peers/{peer_id}; already in the tree
# through libp2p, which this crate does not depend on.
bs58 = "0.5.1"
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util.workspace = true
ethlambda-blockchain.workspace = true
ethlambda-engine.workspace = true
ethlambda-fork-choice.workspace = true
ethlambda-metrics.workspace = true
ethlambda-network-api.workspace = true
ethlambda-state-transition.workspace = true
ethlambda-storage.workspace = true
ethlambda-test-fixtures.workspace = true
ethlambda-types.workspace = true
libssz.workspace = true
libssz-derive.workspace = true
libssz-types.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tracing.workspace = true
jemalloc_pprof.workspace = true
reqwest.workspace = true
thiserror.workspace = true
futures-util = "0.3"
# A submitted batch of PQ attestations is checked in parallel: each one is a
# leanXMSS verification (`beacon::pool::post_pq_attestations`).
rayon.workspace = true

[dev-dependencies]
ethlambda-validator = { workspace = true, features = ["test-utils"] }
spawned-concurrency.workspace = true
ethlambda-state-transition = { workspace = true, features = ["test-utils"] }
ethlambda-types.workspace = true
libssz-types.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
