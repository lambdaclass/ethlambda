[package]
name = "ethlambda-ethrex-engine"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
ethrex-common.workspace = true
ethrex-storage.workspace = true
ethrex-blockchain.workspace = true
# Execution-layer transaction gossip (devp2p: discv4 + RLPx), independent of the
# consensus layer's libp2p stack.
ethrex-p2p.workspace = true
secp256k1 = { version = "0.30.0", default-features = false, features = [
  "global-context",
  "recovery",
  "std",
] }
tokio-util.workspace = true
ethlambda-types.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Building the EIP-1559 signing payload for test transactions. secp256k1 itself
# is a normal dependency, for the devp2p node key.
ethrex-rlp.workspace = true
