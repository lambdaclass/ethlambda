[package]
name = "ethlambda-ethrex-engine"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
ethrex-common.workspace = true
ethrex-storage.workspace = true
ethrex-blockchain.workspace = true
ethlambda-types.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Signing test transactions: the RLP encoder to build the EIP-1559 signing
# payload, and secp256k1 to sign it. Version-matched to ethrex's own so no
# second copy enters the graph.
ethrex-rlp.workspace = true
secp256k1 = { version = "0.30.0", default-features = false, features = [
  "global-context",
  "recovery",
  "std",
] }
