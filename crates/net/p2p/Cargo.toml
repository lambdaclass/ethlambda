[package]
name = "ethlambda-p2p"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ethlambda-network-api.workspace = true
ethlambda-storage.workspace = true
ethlambda-metrics.workspace = true
ethlambda-types.workspace = true

spawned-concurrency.workspace = true

futures = "0.3"
tokio-stream = "0.1"

# Fork with request-response feature for outbound protocol selection
libp2p = { git = "https://github.com/lambdaclass/rust-libp2p.git", rev = "2f14d0ec9665a01cfb6a02326c90628c4bba521c", features = [
    "full",
] }

snap = "1.1"

tokio.workspace = true
tracing.workspace = true

rand = "0.8"

# Required for NodeEnr parsing
# TEMPORARY: absolute path dependency on an unpushed local ethrex branch
# (feat/lean-discovery-hooks). Builds only on this machine — CI and any other
# checkout will fail to resolve it. Restore the git + rev form before opening a
# PR; see the plan's "Reverting the path dependency" section.
ethrex-p2p = { path = "/Users/mega/execution/ethrex/crates/networking/p2p" }
ethrex-rlp = { path = "/Users/mega/execution/ethrex/crates/common/rlp" }
ethrex-common = { path = "/Users/mega/execution/ethrex/crates/common" }

# Versions pinned to ethrex's workspace: these types cross the API boundary.
secp256k1 = { version = "0.30.0", default-features = false, features = ["global-context", "recovery", "rand"] }
bytes = "1.6.0"

# SSZ
libssz.workspace = true
libssz-derive.workspace = true
libssz-merkle.workspace = true
libssz-types.workspace = true

sha2 = "0.10"

[dev-dependencies]
hex.workspace = true
