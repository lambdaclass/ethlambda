[package]
name = "ethlambda-p2p"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ethlambda-network-api.workspace = true
ethlambda-storage.workspace = true
ethlambda-metrics.workspace = true
ethlambda-types.workspace = true

spawned-concurrency.workspace = true

futures = "0.3"
tokio-stream = "0.1"

# Fork with request-response feature for outbound protocol selection
libp2p = { git = "https://github.com/lambdaclass/rust-libp2p.git", rev = "2f14d0ec9665a01cfb6a02326c90628c4bba521c", features = [
    "full",
] }

snap = "1.1"

tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

rand = "0.8"

# Required for NodeEnr parsing.
#
# Points at an unmerged ethrex commit: the feat/discovery-peer-requirements
# branch carries the unified discovery module, the peer table, and the
# `PeerFilter` seam this crate needs, none of which are on ethrex's main yet.
# Pinned by `rev` rather than `branch` so a force-push or a new commit on that
# branch cannot change what this crate builds against without a visible edit
# here. Repoint at a main revision once the branch merges.
ethrex-p2p = { git = "https://github.com/lambdaclass/ethrex", rev = "bf40128061531317366bd0f5718250de0cb83ad7" }
ethrex-rlp = { git = "https://github.com/lambdaclass/ethrex", rev = "bf40128061531317366bd0f5718250de0cb83ad7" }
ethrex-common = { git = "https://github.com/lambdaclass/ethrex", rev = "bf40128061531317366bd0f5718250de0cb83ad7" }

# Version pinned to ethrex's workspace: `SecretKey` crosses the API boundary.
secp256k1 = { version = "0.30.0", default-features = false, features = ["global-context"] }

# SSZ
libssz.workspace = true
libssz-derive.workspace = true
libssz-merkle.workspace = true
libssz-types.workspace = true

sha2 = "0.10"

[dev-dependencies]
hex.workspace = true
# `rand` seeds the throwaway signing keys the ENR tests build records with.
secp256k1 = { version = "0.30.0", default-features = false, features = ["global-context", "rand"] }
