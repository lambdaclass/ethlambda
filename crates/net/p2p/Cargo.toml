[package]
name = "ethlambda-p2p"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ethlambda-network-api.workspace = true
ethlambda-storage.workspace = true
ethlambda-metrics.workspace = true
ethlambda-types.workspace = true
# For `verify_data_column_sidecar`, the one sidecar check cheap enough to run
# in the gossip loop: pure structural validation, no KZG. `blst` and `c-kzg`
# were already on this binary's dependency path through the chain actor; this
# only widens which crate in it links them.
ethlambda-state-transition.workspace = true

spawned-concurrency.workspace = true

futures = "0.3"
tokio-stream = "0.1"

# Fork with request-response feature for outbound protocol selection
libp2p = { git = "https://github.com/lambdaclass/rust-libp2p.git", rev = "2f14d0ec9665a01cfb6a02326c90628c4bba521c", features = [
    "full",
] }

# Mainnet beacon peers refuse a yamux-only muxer proposal, so the TCP transport
# has to offer mplex too. The libp2p facade dropped its `mplex` re-export when
# the muxer was deprecated, so it is taken directly from the same pinned tree.
# See the `muxers` module for the measurement.
libp2p-mplex = { git = "https://github.com/lambdaclass/rust-libp2p.git", rev = "2f14d0ec9665a01cfb6a02326c90628c4bba521c" }

snap = "1.1"

# Only to name the TCP muxer's error type, `Either<yamux::Error, io::Error>`,
# which libp2p-core builds from this crate and does not re-export. Read by
# `disconnect_cause` to say why a TCP peer's connection ended.
either = "1"

tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
thiserror.workspace = true

rand = "0.8"

# Required for NodeEnr parsing.
#
# Pinned to the head of ethrex PR #7217, which moves the contact table into the
# discovery server and gives a consumer `DiscoveryHandle::record_peer_event` to
# report its own connections with. That is what lets a libp2p client feed
# ethrex's lookup pacing; see `docs/discovery.md`.
#
# A commit rather than a branch, for the reason the release tag it replaces was
# chosen over `main`: what this crate builds against must not move without the
# manifest saying so. Goes back to a tag once #7217 is in a release.
ethrex-p2p = { git = "https://github.com/lambdaclass/ethrex", rev = "4462253ea2785b20d8ee8822034f2a98b49ae839" }
ethrex-rlp = { git = "https://github.com/lambdaclass/ethrex", rev = "4462253ea2785b20d8ee8822034f2a98b49ae839" }
ethrex-common = { git = "https://github.com/lambdaclass/ethrex", rev = "4462253ea2785b20d8ee8822034f2a98b49ae839" }

# `rand` seeds the throwaway signing keys the ENR tests build records with.
secp256k1.workspace = true

# SSZ
libssz.workspace = true
libssz-derive.workspace = true
libssz-merkle.workspace = true
libssz-types.workspace = true

sha2 = "0.10"
hex.workspace = true
