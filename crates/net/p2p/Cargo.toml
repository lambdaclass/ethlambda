[package]
name = "ethlambda-p2p"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ethlambda-network-api.workspace = true
ethlambda-storage.workspace = true
ethlambda-metrics.workspace = true
ethlambda-types.workspace = true

spawned-concurrency.workspace = true

futures = "0.3"
tokio-stream = "0.1"

# Fork with request-response feature for outbound protocol selection
libp2p = { git = "https://github.com/lambdaclass/rust-libp2p.git", rev = "2f14d0ec9665a01cfb6a02326c90628c4bba521c", features = [
    "full",
] }

snap = "1.1"

tokio.workspace = true
tracing.workspace = true

rand = "0.8"

# Discovery is built on ethrex's discv5 stack. The branch is not merged to
# ethrex `main` yet, so this tracks the branch rather than a release; `Cargo.lock`
# pins the exact commit, and `cargo update -p ethrex-p2p` is what moves it.
#
# The branch is rebased and force-pushed regularly. If a build starts failing
# inside ethrex rather than here, check whether the pinned commit still exists
# before assuming an API change.
ethrex-p2p = { git = "https://github.com/lambdaclass/ethrex.git", branch = "feat/discovery-peer-requirements" }
ethrex-rlp = { git = "https://github.com/lambdaclass/ethrex.git", branch = "feat/discovery-peer-requirements" }
ethrex-common = { git = "https://github.com/lambdaclass/ethrex.git", branch = "feat/discovery-peer-requirements" }
# Only for the empty in-memory Store that DiscoveryServer::spawn requires.
ethrex-storage = { git = "https://github.com/lambdaclass/ethrex.git", branch = "feat/discovery-peer-requirements" }

# Versions pinned to ethrex's workspace: these types cross the API boundary.
secp256k1 = { version = "0.30.0", default-features = false, features = ["global-context", "recovery", "rand"] }
bytes = "1.6.0"

# SSZ
libssz.workspace = true
libssz-derive.workspace = true
libssz-merkle.workspace = true
libssz-types.workspace = true

sha2 = "0.10"
hex.workspace = true
