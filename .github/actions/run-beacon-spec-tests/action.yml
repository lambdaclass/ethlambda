name: "Run Beacon Chain spec tests"
description: >-
  Fetches one preset's consensus-spec-tests tree and the BLS/KZG vectors, then
  runs `make test-beacon-<preset>`. Assumes the repository has already been
  checked out by the caller.

inputs:
  preset:
    description: "`mainnet` or `minimal`"
    required: true

runs:
  using: "composite"
  steps:
    # One key for both presets: the preset is selected at runtime
    # (`BEACON_SPEC_PRESET`), so the two jobs build the same spec binary, and
    # the minimal job's build is a subset of the mainnet job's.
    - name: Setup Rust
      uses: $/.github/actions/setup-rust
      with:
        cache-key: beacon-spec

    # Deliberately not cached. The trees expand to several GiB, which against a
    # repository-wide 10 GiB cache budget would evict the Rust build caches
    # that actually save time here. The assets are pinned to a release and
    # served from the same CDN as the runner, so re-fetching is the cheap half
    # of that trade.
    #
    # Its own step rather than leaning on the make prerequisite, so the log
    # separates download time from build-and-test time and a fixture outage is
    # not reported as a test failure.
    #
    # CONSENSUS_SPEC_TESTS_CONFIGS is read by the Makefile, which declares it
    # `?=` and so defers to the environment. A run reads its own preset's tree
    # and nothing else, so fetching the other preset's would be the largest
    # single download in the workflow spent on files no case opens. It is set
    # on every make step below, not only here: the fixture stamp is named after
    # it, so a step that reached the stamp without it (the test step does,
    # through its prerequisites) would name a different stamp, wipe the tree
    # and fetch both presets again before running.
    - name: Download the consensus spec test fixtures
      shell: bash
      env:
        CONSENSUS_SPEC_TESTS_CONFIGS: ${{ inputs.preset }}
      run: make consensus-spec-tests

    # The preset-independent BLS/KZG vectors, a separate download. The variable
    # is set here too only so that no make step runs without it.
    - name: Download the BLS/KZG test vectors
      shell: bash
      env:
        CONSENSUS_SPEC_TESTS_CONFIGS: ${{ inputs.preset }}
      run: make cryptography-specs

    - name: Run the Beacon Chain spec tests
      shell: bash
      env:
        CONSENSUS_SPEC_TESTS_CONFIGS: ${{ inputs.preset }}
      run: make test-beacon-${{ inputs.preset }}

    # See the same step in the run-fixture-tests action.
    - name: Report disk usage after the build
      if: always()
      shell: bash
      run: df -h /
