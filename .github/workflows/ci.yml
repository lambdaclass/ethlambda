name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Setup cache
        # Tools under tooling/ are separate Cargo workspaces with their own
        # target dir and Cargo.lock, so they need listing explicitly or their
        # builds are neither cached nor reflected in the cache key.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tooling/event-monitor

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # tooling/ is outside the root workspace, so the steps above never touch
      # it. Its tests run here rather than in the `test` job because clippy has
      # already compiled the test targets, and because they need none of that
      # job's leanSpec fixtures.
      - name: Lint tooling
        run: make tooling-lint

      - name: Test tooling
        run: make tooling-test

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run fixture-based tests
        uses: ./.github/actions/run-fixture-tests
