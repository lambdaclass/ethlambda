name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  # Off in CI, on for local rebuilds, which is what the `release-fast` profile's
  # `incremental = true` is for. An environment variable overrides the profile
  # setting, so this turns it off here without touching the manifest.
  #
  # Incremental state is pure cost on a runner: `Swatinem/rust-cache` deletes
  # `target/*/incremental` before saving, so it is never restored, and every job
  # here starts from whatever the cache holds rather than from its own previous
  # build. Nothing reads it, yet writing it costs about as much disk as the
  # build output itself.
  CARGO_INCREMENTAL: "0"

jobs:
  # Whether this change touches anything the jobs below build or run. A pull
  # request or merge group made only of documentation and repository metadata
  # skips all of them; the list of such paths, and the rule for deciding, are in
  # the detect-changes action.
  #
  # Every job below gates on it with the same condition:
  #
  #   if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
  #
  # `!= 'false'` and `!cancelled()` make it fail open. Without `!cancelled()`,
  # a failure here would skip every dependent job, and a skipped job satisfies
  # a required check, so a broken change detector would let anything merge
  # untested. With it, a failure leaves the output empty and everything runs.
  # (The filter step itself cannot fail the job: it continues on error and
  # reports `true`. What remains is a failure of the job around it, e.g. its
  # checkout.)
  #
  # The jobs gate at job level, so a skip shows as skipped, which GitHub counts
  # as passing for a required check. That only holds for a check name that
  # exists: a matrix job skipped this way reports one check under its
  # unexpanded name (`Test (${{ matrix.half }})`), so the per-leg checks branch
  # protection requires would never report. Hence the test halves and the two
  # beacon presets are separate jobs rather than matrix legs.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's files through the REST API.
      pull-requests: read
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      # Needed for merge groups, which paths-filter diffs with git.
      - uses: actions/checkout@v6.1.0

      - uses: $/.github/actions/detect-changes
        id: changes

  # No job here deletes the runner's preinstalled toolchains first (the
  # free-disk action, which kurtosis_assertoor.yml still uses). It took 1.5-3.5
  # min per job, and hosted runners now have a 145 GB root disk: the daily run,
  # which never freed anything, ended each test half at 65-70 GB used. The test
  # halves and the beacon jobs still print `df -h /` after their build, so a
  # runner change that leaves too little room shows up there. If one does, a
  # full disk reaches `rust-lld` through `mmap`, so it is reported as
  # `ld terminated with signal 7 [Bus error]` rather than as ENOSPC.
  #
  # `lint`, `presets` and `tooling` were one job. Split because serially they
  # took 34 minutes and, at the time, more disk than a runner had.
  lint:
    name: Lint
    runs-on: ${{ vars.ETHLAMBDA_RUNNER || 'ubuntu-latest' }}
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: lint
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The compile-time half of what the docs-only skip in `detect-changes`
      # assumes. The Makefile target says what it checks and what it cannot;
      # `make lint` runs it too.
      - name: No build reads a docs-only path
        run: make inert-paths-check

      - name: Cargo check
        run: cargo check --locked --workspace --all-targets

      # Seconds, not minutes: same fingerprints as `check` above.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The leanSpec spectests are `test = false` while the released fixtures
      # lag leanVM, and `--all-targets` leaves such targets out. Name them so
      # they keep compiling until they run again.
      - name: Clippy (skipped spectests)
        run: cargo clippy --locked --workspace --test forkchoice_spectests --test signature_spectests --test stf_spectests --test ssz_spectests --test interchange_vectors -- -D warnings

      # `ethlambda-storage` with its `rocksdb` feature off, test targets
      # included. Every other build of its tests goes through the workspace,
      # where `bin/ethlambda` turns the feature on, so a test or helper that
      # names `RocksDBBackend` without the feature would break a plain
      # `cargo test -p ethlambda-storage` and nothing else would notice.
      - name: Clippy (storage without RocksDB)
        run: cargo clippy --locked -p ethlambda-storage --all-targets -- -D warnings

      # The binary alone, with the features it ships with. Every other build of
      # it in this workflow, `Cargo check` above and `Test (node)` included,
      # unifies the dev-dependencies' features in (`bin/ethlambda` enables
      # tokio's `test-util`), so code that compiles only because of one would
      # pass them all and break `cargo build --release`. The `Benchmark smoke`
      # job's `cargo run` used to be the build that caught it.
      - name: Cargo check (binary, shipped features)
        run: cargo check --locked -p ethlambda

  # Two features gate code that no step in `lint` reaches, so both would rot
  # silently between merges.
  #
  # `beacon-spec-tests` guards the beacon spec-test target, which declares it as
  # a required feature so that `cargo test` skips a suite whose fixtures are a
  # multi-gigabyte download. `--all-targets` in `lint` therefore never builds
  # it. The `beacon-spec-tests-*` jobs below do download them and run the suite
  # for real, so this job is not what proves the runners work; it is here
  # because those jobs are by far the slowest in the workflow, and because this
  # is the only place the runners are linted at `-D warnings`.
  #
  # `preset-minimal` is a whole second compilation, because the beacon
  # containers' SSZ bounds are const-generic arguments and everything in `lint`
  # builds the default (mainnet) preset only. The fixture-reading unit tests
  # stay `ignore`d here, since `beacon-spec-tests` is off.
  #
  # `--lib`: this job downloads no fixtures, and the integration targets
  # (`ssz_spectests`, `stf_spectests`) walk the leanSpec tree, which only `test`
  # has. Both presets, not just the default: the spec suite's `genesis` runner
  # is `#![cfg(feature = "preset-minimal")]`, so a mainnet build type-checks
  # every runner except the sole coverage `beacon::genesis` has.
  presets:
    name: Test minimal preset
    runs-on: ${{ vars.ETHLAMBDA_RUNNER || 'ubuntu-latest' }}
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
    steps:
      - uses: actions/checkout@v6.1.0

      # Its own entry. These builds share almost no artifacts with `lint`'s,
      # so on one key each run would evict the other's.
      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: presets
          components: clippy

      - name: Check the beacon spec-test suite compiles
        run: |
          cargo clippy -p ethlambda-state-transition --all-targets --features beacon-spec-tests -- -D warnings
          cargo clippy -p ethlambda-state-transition --all-targets --features beacon-spec-tests,preset-minimal -- -D warnings

      - name: Check the minimal preset
        run: |
          cargo test -p ethlambda-types --lib --features preset-minimal
          cargo test -p ethlambda-state-transition --lib --features preset-minimal

  # tooling/event-monitor declares its own [workspace] table, so both jobs above
  # stop at the root members and never reach it. Hence its own job, and the
  # `workspaces` input below pointing the cache at its target dir.
  #
  # `--locked` so the committed Cargo.lock is actually enforced: without it
  # cargo silently resolves and rewrites the lockfile in CI, and a stale or
  # missing entry never fails the build.
  tooling:
    name: Tooling
    runs-on: ${{ vars.ETHLAMBDA_RUNNER || 'ubuntu-latest' }}
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: tooling
          components: rustfmt, clippy
          workspaces: tooling/event-monitor

      - name: Lint tooling
        working-directory: tooling/event-monitor
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test tooling
        working-directory: tooling/event-monitor
        run: cargo test --locked

  # The workspace suite in two halves; `CONSENSUS_CRATES` in the Makefile
  # defines them and says why. Both need the leanSpec fixtures and share one
  # cache entry for them, so only the first job to arrive downloads anything.
  # Two jobs rather than a matrix: see `detect-changes`.
  test-consensus:
    name: Test (consensus)
    runs-on: ${{ vars.ETHLAMBDA_RUNNER || 'ubuntu-latest' }}
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Run fixture-based tests
        uses: $/.github/actions/run-fixture-tests
        with:
          make-target: test-consensus

  test-node:
    name: Test (node)
    runs-on: ${{ vars.ETHLAMBDA_RUNNER || 'ubuntu-latest' }}
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Run fixture-based tests
        uses: $/.github/actions/run-fixture-tests
        with:
          make-target: test-node

  # The benchmark smoke check (the harness and its JSON report contract) used to
  # be a job of its own here, running `cargo run ... benchmark synthetic` under
  # `jq -e`. It is an integration test now, `bin/ethlambda/tests/
  # benchmark_smoke.rs`, which `Test (node)` runs. A `cargo run` step inside the
  # test job would have rebuilt tokio and everything above it, because `cargo
  # run` resolves features without the dev-dependencies' (`bin/ethlambda`
  # enables tokio's `test-util`). An integration test does not: cargo builds the
  # binary for it with the test build's own features, so the only extra work is
  # the binary crate itself. That retires a job which compiled the whole node a
  # second time, and its 1.8 GB cache entry.

  # Stable cargo ignores the publish-age cooldown in .cargo/config.toml, so the
  # lockfile can pin too-young crates. Fail the build when either lockfile does.
  # Infrastructure failures (toolchain download, a resolution that fails for
  # reasons unrelated to age, e.g. a yanked upstream crate) only warn: they are
  # outside the PR's control and would block every PR.
  cooldown:
    name: Dependency cooldown
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Check lockfiles against the publish-age cooldown
        run: |
          if ! rustup toolchain install nightly-2026-06-21 --profile minimal; then
            echo "::warning title=Publish-age cooldown check skipped::toolchain install failed"
            exit 0
          fi
          status=0
          for manifest in Cargo.toml tooling/event-monitor/Cargo.toml; do
            if ! cargo +nightly-2026-06-21 update --dry-run -Z min-publish-age --manifest-path "$manifest" > cooldown.txt 2>&1; then
              # Drop the index/git refresh chatter so the excerpt is the actual error; %0A = newline in annotations
              msg=$(grep -v '^ *Updating ' cooldown.txt | head -20 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::warning title=Publish-age cooldown probe failed for $manifest::$msg"
              continue
            fi
            # A cooldown-driven downgrade is annotated with the too-young version's
            # publish date; downgrades for other reasons (MSRV, a tightened
            # requirement) carry no such note and are not this check's business.
            hits=$(grep -E '^ *Downgrading .*published' cooldown.txt || true)
            if [ -n "$hits" ]; then
              count=$(echo "$hits" | wc -l | tr -d ' ')
              msg=$(echo "$hits" | head -20 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=$manifest pins $count crate(s) younger than the publish-age cooldown::$msg"
              status=1
            fi
          done
          exit $status

  # One job per preset rather than a matrix (see `detect-changes`); the steps
  # are in the run-beacon-spec-tests action. They walk different fixture trees,
  # so whether a failure is preset-specific or common to both is most of the
  # triage, and as separate jobs neither cancels the other.
  #
  # Far and away the longest jobs here: a fixture tree to fetch and a
  # release-grade build before the first case runs. Bounded well above what a
  # healthy run takes, purely so a hang is reaped in tens of minutes rather than
  # sitting on a runner for GitHub's six-hour default.
  beacon-spec-tests-mainnet:
    name: Beacon spec tests (mainnet)
    runs-on: ${{ vars.ETHLAMBDA_RUNNER || 'ubuntu-latest' }}
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Run the Beacon Chain spec tests
        uses: $/.github/actions/run-beacon-spec-tests
        with:
          preset: mainnet

  beacon-spec-tests-minimal:
    name: Beacon spec tests (minimal)
    runs-on: ${{ vars.ETHLAMBDA_RUNNER || 'ubuntu-latest' }}
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.run_tests != 'false' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Run the Beacon Chain spec tests
        uses: $/.github/actions/run-beacon-spec-tests
        with:
          preset: minimal
