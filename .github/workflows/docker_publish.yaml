name: Publish Docker Image

# Manual publishing of devnet images (`devnetX`) and other ad-hoc tags from any
# branch. Every tag the release pipeline maintains is refused here, so the two
# never fight over one: `unstable` (release.yaml, on every push to main), version
# tags (release.yaml for candidates, release_promote.yaml for final releases),
# and `latest` (release_promote.yaml). `sha-*` is refused too, since this
# workflow already adds `sha-<7>` for the commit it builds, and so is any tag
# ending in `-minimal` or `-shadow`, the suffixes it adds itself. See RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Docker image tags, comma-separated (e.g., devnet5,devnet5-fix)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TAGS_INPUT: ${{ inputs.tags }}

jobs:
  check-tags:
    name: Refuse release-pipeline tags
    runs-on: ubuntu-latest
    steps:
      - name: Check tags
        run: |
          set -euo pipefail
          status=0
          IFS=',' read -ra TAG_ARRAY <<< "${TAGS_INPUT}"
          for t in "${TAG_ARRAY[@]}"; do
            if [[ "$t" =~ ^((latest|unstable)(-minimal|-shadow)?|sha-.*|v?[0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              echo "::error::'$t' is reserved for the release pipeline or added automatically; see RELEASE.md"
              status=1
            # Every variant appends its suffix to every tag, so a tag already
            # ending in one gets the default (ethrex) build under the variant's
            # name: `devnet5-minimal` would publish ethrex as `devnet5-minimal`,
            # and beside `devnet5` the two jobs would race to push the same
            # `devnet5-minimal-<arch>` tag with different builds.
            elif [[ "$t" =~ -(minimal|shadow)$ ]]; then
              echo "::error::'$t' ends in a variant suffix, which this workflow adds to every tag itself; give the tag without it"
              status=1
            fi
          done
          exit "$status"

  build-image:
    name: Build Docker image (${{ matrix.arch.name }}, ${{ matrix.variant.name }})
    needs: check-tags
    strategy:
      matrix:
        arch:
          - runner: ubuntu-latest
            name: amd64
          - runner: ubuntu-22.04-arm
            name: arm64
        # Each tag is published three times, as release.yaml publishes its own:
        # the regular image, with ethrex embedded as the beacon node's execution
        # client (`include-ethrex`); the same build without it (tag suffixed
        # "-minimal"); and a Shadow-simulator-compatible image (tag suffixed
        # "-shadow"). The variant names are also the registry cache tags both
        # workflows share, so each must build what release.yaml builds under
        # that name. The shadow build args mirror the `shadow-docker-build`
        # Makefile target. LOCKED= builds the shadow variant unlocked (the
        # quinn-udp [patch] is absent from Cargo.lock; see Dockerfile), so
        # -shadow images are not reproducible and should not be treated as
        # equivalent-security artifacts to the regular tags.
        variant:
          - name: default
            suffix: ""
            build_args: |
              FEATURES=include-ethrex
          - name: minimal
            suffix: "-minimal"
            build_args: ""
          - name: shadow
            suffix: "-shadow"
            build_args: |
              SHADOW=1
              FEATURES=shadow-integration
              NO_DEFAULT_FEATURES=--no-default-features
              LOCKED=
    runs-on: ${{ matrix.arch.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to the Container registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        env:
          SUFFIX: ${{ matrix.variant.suffix }}
          ARCH: ${{ matrix.arch.name }}
        run: |
          TAGS=""
          IFS=',' read -ra TAG_ARRAY <<< "${TAGS_INPUT}"
          for t in "${TAG_ARRAY[@]}"; do
            TAGS="${TAGS}${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${t}${SUFFIX}-${ARCH},"
          done
          TAGS="${TAGS%,}"  # Remove trailing comma
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            ${{ matrix.variant.build_args }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          platforms: linux/${{ matrix.arch.name }}
          # In the registry rather than the Actions cache, under the same tags
          # release.yaml uses; that workflow says why.
          #
          # Only a run dispatched on main exports, the rule every cache here
          # follows (see the setup-rust action). This workflow is dispatched
          # from any branch for devnet images, and these tags feed every main
          # and release-candidate build: a branch's export would carry its
          # layers into a release, and a branch with a different Cargo.lock
          # would replace the dependency layer, so main's next build would
          # recompile every dependency. Every run still reads main's cache,
          # which is a hit whenever the lockfile matches.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch.name }}-${{ matrix.variant.name }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}/{1}:buildcache-{2}-{3},mode=max,ignore-error=true', env.REGISTRY, env.IMAGE_NAME, matrix.arch.name, matrix.variant.name) || '' }}

  publish-manifest:
    name: Create and push multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${TAGS_INPUT}"
          FIRST_TAG="${TAG_ARRAY[0]}"
          SHORT="${SHORT_SHA::7}"

          # Publish each tag three times: the regular image, its "-minimal"
          # and its "-shadow" twin. These suffixes must stay in sync with the
          # `variant` matrix suffixes in the build-image job above and with
          # the suffixes check-tags refuses: a new variant must be added in
          # all three.
          for suffix in "" "-minimal" "-shadow"; do
            # First tag also gets an immutable sha-<sha> tag.
            docker buildx imagetools create \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${FIRST_TAG}${suffix} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT}${suffix} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${FIRST_TAG}${suffix}-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${FIRST_TAG}${suffix}-arm64

            # Remaining tags.
            for t in "${TAG_ARRAY[@]:1}"; do
              docker buildx imagetools create \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${t}${suffix} \
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${t}${suffix}-amd64 \
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${t}${suffix}-arm64
            done
          done
