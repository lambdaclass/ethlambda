[package]
name = "ethlambda"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["jemalloc"]
# jemalloc allocator with heap profiling. Build the Shadow binary with
# `--no-default-features --features shadow-integration` to drop it: jemalloc's
# `unprefixed_malloc` overrides the system allocator symbols, conflicting with
# the Shadow simulator's preload shim. Cargo features are additive, so a feature
# cannot subtract a default-on dependency; hence the `--no-default-features`.
jemalloc = ["dep:tikv-jemallocator"]
# Shadow simulator compatibility: single-threaded tokio runtime and no jemalloc.
# The quinn-udp UDP fallback is a Cargo `[patch]` (which cannot be feature-gated),
# injected at build time by `shadow/build.sh` / `make shadow-build`.
shadow-integration = ["ethlambda-crypto/shadow-integration"]

[dependencies]
ethlambda-beacon.workspace = true
ethlambda-blockchain.workspace = true
ethlambda-crypto.workspace = true
ethlambda-network-api.workspace = true
ethlambda-p2p.workspace = true
ethlambda-types.workspace = true
ethlambda-rpc.workspace = true
ethlambda-storage.workspace = true

libssz.workspace = true
libssz-types.workspace = true

tokio.workspace = true
tokio-util.workspace = true
# `ethlambda beacon` serves the sync metrics itself: the lean API needs a lean
# Store and controllers it has none of, so it mounts only the metrics router.
axum = "0.8.1"

tracing.workspace = true
tracing-subscriber = "0.3"

serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
hex.workspace = true

clap.workspace = true
reqwest.workspace = true
thiserror.workspace = true
eyre.workspace = true

# Pinned to ethlambda-p2p's discovery module, which takes a raw secp256k1
# `SecretKey` in `DiscoverySpawnConfig`. `rand` is for `run_beacon`'s
# ephemeral-key generation when `--node-key` is omitted; it also re-exports
# the `rand` crate (`secp256k1::rand`), so nothing else needs a direct dep on it.
secp256k1 = { version = "0.30.0", default-features = false, features = ["global-context", "rand"] }

tikv-jemallocator = { workspace = true, optional = true }

libc.workspace = true

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]`: the checkpoint-sync
# tests would otherwise wait out the real retry backoff. Dev-only, so the
# feature never reaches the shipped binary.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
vergen-git2.workspace = true
