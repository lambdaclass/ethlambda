# A PQ-at-genesis devnet: Lighthouse (pq-devnet-0) proposes and validates, the
# ethlambda beacon node follows. Not runnable at b5d422b2 until Lighthouse
# moves to its VRF rule. See README.md.
participants:
  - el_type: geth
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:pq-devnet-0
    vc_image: ethpandaops/lighthouse:pq-devnet-0
    validator_count: 64
    supernode: true
  - el_type: geth
    cl_type: ethlambda
    cl_image: ethlambda:pq-local
    validator_count: 0
    cl_log_level: info
network_params:
  preset: mainnet
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  pq_fork_epoch: 0
additional_services:
  - dora
