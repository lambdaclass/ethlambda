# heze-devnet-2's client set (Heze with EIP-7805 FOCIL, EIP-8015 and EIP-8365,
# consensus-specs v1.7.0-beta.4 plus #5724 and #5727) with `ethlambda beacon`
# and the ethlambda validator client added, so ethlambda builds and publishes
# inclusion lists and proposes heze blocks among the clients the devnet runs.
# Images follow the devnet's spec sheet
# (https://notes.ethereum.org/@ethpandaops/heze-devnet-2): lighthouse, lodestar
# and teku on `heze-devnet-2`, every execution client ethrex on
# `focil-devnet-1` as in devnet-1. Run from the repository root, after
# building the image as `ethlambda:heze-devnet-2`:
#
#   kurtosis run --enclave ethlambda-heze tooling/kurtosis-validator \
#     --args-file tooling/kurtosis-validator/network_params_heze_devnet_2.yaml
#
# ethlambda beacon is paired with ethrex rather than geth, since heze needs
# Bogota's Engine API (`engine_newPayloadV6`, `engine_forkchoiceUpdatedV5`,
# `engine_getInclusionListV1`). Gloas from genesis and heze one epoch later,
# so the run crosses the heze upgrade. spamoor keeps the mempools non-empty,
# which is what gives the inclusion lists transactions to carry.
participants:
  - el_type: ethrex
    el_image: ethpandaops/ethrex:focil-devnet-1
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:heze-devnet-2
    validator_count: 64
    supernode: true
    cl_extra_params:
      - --subscribe-all-subnets
  - el_type: ethrex
    el_image: ethpandaops/ethrex:focil-devnet-1
    cl_type: lodestar
    cl_image: ethpandaops/lodestar:heze-devnet-2
    validator_count: 64
    supernode: true
  - el_type: ethrex
    el_image: ethpandaops/ethrex:focil-devnet-1
    cl_type: teku
    cl_image: ethpandaops/teku:heze-devnet-2
    validator_count: 64
    supernode: true
network_params:
  preset: mainnet
  gloas_fork_epoch: 0
  heze_fork_epoch: 1
  preregistered_validator_count: 256
additional_services:
  - dora
  - spamoor
global_log_level: info

ethlambda_validator:
  image: ethlambda:heze-devnet-2
  name: ethlambda-vc
  suggested_fee_recipient: "0x000000000000000000000000000000000000dEaD"

ethlambda_beacon:
  enabled: true
  fallback: false
  el: ethrex
  el_image: ethpandaops/ethrex:focil-devnet-1
