# The devnet in network_params.yaml, with the ethlambda validator talking to
# `ethlambda beacon` first and the lighthouse participant second.
#
# ethlambda beacon runs with a geth of its own and serves the duties,
# attestation data, attestation pool, aggregation and block production, and the
# validator client talks to it alone (`fallback: false`), so every block on the
# chain is one ethlambda beacon built. Lighthouse stays in the network as a
# peer. Run from the repository root, after
# `make docker-build DOCKER_TAG=beacon-block-production`:
#
#   kurtosis run --enclave ethlambda-beacon-devnet tooling/kurtosis-validator \
#     --args-file tooling/kurtosis-validator/network_params_ethlambda_beacon.yaml
#
# Two lighthouse participants rather than one, because ethereum-package pins a
# lone lighthouse to `--target-peers=0`, which makes it refuse every inbound
# peer, ethlambda beacon included, and lighthouse rejects the flag given twice,
# so it cannot be overridden. `--subscribe-all-subnets` because ethlambda beacon
# publishes attestations through gossipsub fanout, which reaches only peers
# subscribed to the subnet, and a lighthouse with no validators of its own joins
# almost none. ethlambda beacon aggregates for the validator client itself, so
# lighthouse needs no `--import-all-attestations`: it receives the aggregates on
# `beacon_aggregate_and_proof` and packs them into the blocks it proposes.
#
# `spamoor` with an explicit `blob-combined` spammer, so the blocks ethlambda
# beacon builds carry blobs, which exercises column publication and the cell
# proof checks. It is spelled out because `main.star` imports ethereum-package
# unpinned, so its default spammers may change. A user `spammers` list replaces
# the default list rather than appending to it (input_parser.star overwrites
# each `spamoor_params` key), so the default EOA spammer is dropped here.
# `shard_committee_period: 1` shortens how long a validator must have been
# active before it may exit, so a voluntary exit posted to the pool can be
# tested within minutes instead of 256 epochs.
participants:
  - el_type: geth
    cl_type: lighthouse
    validator_count: 0
    supernode: true
    count: 2
    cl_extra_params:
      - --subscribe-all-subnets
network_params:
  preset: mainnet
  electra_fork_epoch: 0
  fulu_fork_epoch: 0
  preregistered_validator_count: 128
  shard_committee_period: 1
additional_services:
  - dora
  - spamoor

spamoor_params:
  spammers:
    - name: Blob Spammer
      description: 3 type-4 blob transactions per slot with 1-2 sidecars each, gas/blobgas limit 20 gwei
      scenario: blob-combined
      config:
        throughput: 6
        sidecars: 2
        max_pending: 6
        max_wallets: 20
        base_fee: 20
        blob_fee: 20

ethlambda_validator:
  image: ghcr.io/lambdaclass/ethlambda:beacon-block-production
  name: ethlambda-vc
  suggested_fee_recipient: "0x000000000000000000000000000000000000dEaD"

ethlambda_beacon:
  enabled: true
  fallback: false
